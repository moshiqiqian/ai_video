# 2) conda activate indextts
# 3) pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cu126
# 4) cd 项目目录/vendor/index-tts && pip install -e .
# 备注：第 3 步的 CUDA 版 torch 不在 PyPI，必须用 pytorch 官方源；
#       第 4 步把 IndexTTS2 本体装回环境（本地包，无法写进 YAML）。

